[package]
name = "just-print"
version = "0.1.0"
edition = "2024"
description = "A lightweight web service for printing documents via CUPS"
license = "MIT"
repository = "https://github.com/NIyueeE/just-print"
keywords = ["printing", "cups", "pdf", "office", "web"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "json", "query", "matched-path"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
thiserror = "2.0.19"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
non_ascii_idents = "forbid"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
