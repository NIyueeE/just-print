name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: just check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Run full check chain
        run: just check

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image (validation only)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: false
          load: true
          tags: just-print:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (health, readiness, frontend, LibreOffice, CUPS-PDF end-to-end)
        run: |
          set -euo pipefail
          cid="$(docker run -d --rm -p 127.0.0.1:8080:8080 \
            -e JUST_PRINT_TOKEN=ci-smoke-test \
            -e JUST_PRINT_CUPS_PDF=1 \
            just-print:ci)"
          dump_logs() { echo "=== SMOKE FAILED: container logs (tail 150) ==="; docker logs "$cid" 2>&1 | tail -150 || true; }
          trap 'dump_logs' ERR
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          step() { echo "==> $*"; }

          step "wait for /healthz"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz >/dev/null

          step "readiness (/readyz queries CUPS)"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/readyz >/dev/null

          step "static frontend"
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="app">'

          step "toolchain and CUPS-PDF"
          docker exec "$cid" soffice --version
          docker exec "$cid" gs --version
          docker exec "$cid" lpstat -r | grep -q 'scheduler is running'
          docker exec "$cid" lpstat -p CUPS-PDF | grep -q 'CUPS-PDF'

          step "conversions (text + emoji font)"
          docker exec -w /tmp "$cid" sh -c \
            'printf "hello" > sample.txt && soffice --headless --convert-to pdf --outdir /tmp /tmp/sample.txt >/dev/null && test -s /tmp/sample.pdf'
          docker exec -w /tmp "$cid" sh -c \
            'printf "emoji: 😀 🎉 👍 ❤️ ☀️" > /tmp/ci-emoji.txt && soffice --headless --convert-to pdf --outdir /tmp /tmp/ci-emoji.txt >/dev/null && pdffonts /tmp/ci-emoji.pdf | grep -qi symbola'

          step "auth: /api without token -> 401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/printers)" = 401

          step "upload: empty file -> 400"
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer ci-smoke-test' \
            -F 'file=@/dev/null;filename=empty.txt' \
            http://127.0.0.1:8080/api/files)" = 400

          step "formats"
          formats_json="$(curl -fsS -H 'Authorization: Bearer ci-smoke-test' http://127.0.0.1:8080/api/formats)"
          printf '%s' "$formats_json" | grep -q '"extensions"'
          printf '%s' "$formats_json" | grep -q '"pdf"'

          step "printers"
          printers_json="$(curl -s -H 'Authorization: Bearer ci-smoke-test' http://127.0.0.1:8080/api/printers)"
          if ! printf '%s' "$printers_json" | grep -q '"id":"CUPS-PDF"'; then
            echo "printers response: $printers_json"
            exit 1
          fi

          step "upload txt -> preview"
          printf 'hello just-print' > /tmp/ci-sample.txt
          file_json="$(curl -s -H 'Authorization: Bearer ci-smoke-test' \
            -F 'file=@/tmp/ci-sample.txt;filename=ci-sample.txt' \
            http://127.0.0.1:8080/api/files)"
          file_id="$(printf '%s' "$file_json" | sed -n 's/.*"id":"\([0-9a-f]\{32\}\)".*/\1/p')"
          if [ -z "$file_id" ]; then
            echo "upload response: $file_json"
            exit 1
          fi
          curl -fsS -H 'Authorization: Bearer ci-smoke-test' \
            "http://127.0.0.1:8080/api/files/$file_id" -o /tmp/ci-preview.pdf
          head -c 5 /tmp/ci-preview.pdf | grep -q '%PDF-'

          step "markdown -> styled PDF"
          printf '# Just Print MD Test\n\n**bold text**\n\n```\ncode block line\n```\n' > /tmp/ci-sample.md
          md_json="$(curl -s -H 'Authorization: Bearer ci-smoke-test' \
            -F 'file=@/tmp/ci-sample.md;filename=ci-sample.md' \
            http://127.0.0.1:8080/api/files)"
          md_id="$(printf '%s' "$md_json" | sed -n 's/.*"id":"\([0-9a-f]\{32\}\)".*/\1/p')"
          if [ -z "$md_id" ]; then
            echo "markdown upload response: $md_json"
            exit 1
          fi
          md_text="$(curl -fsS -H 'Authorization: Bearer ci-smoke-test' \
            "http://127.0.0.1:8080/api/files/$md_id" | docker exec -i "$cid" pdftotext - -)"
          printf '%s' "$md_text" | grep -q 'Just Print MD Test'
          printf '%s' "$md_text" | grep -q 'code block line'
          if printf '%s' "$md_text" | grep -q '^# Just Print'; then
            echo "raw markdown leaked into PDF"
            exit 1
          fi

          step "print: missing printer -> 404"
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer ci-smoke-test' -H 'Content-Type: application/json' \
            -d "{\"file_id\":\"$file_id\",\"printer_id\":\"missing\"}" \
            http://127.0.0.1:8080/api/print)" = 404

          step "print over IPP -> wait completed"
          print_json="$(curl -s -H 'Authorization: Bearer ci-smoke-test' \
            -H 'Content-Type: application/json' \
            -d "{\"file_id\":\"$file_id\",\"printer_id\":\"CUPS-PDF\",\"options\":{}}" \
            http://127.0.0.1:8080/api/print)"
          job_id="$(printf '%s' "$print_json" | sed -n 's/.*"job_id":"\([^"]*\)".*/\1/p')"
          if [ -z "$job_id" ]; then
            echo "print response: $print_json"
            exit 1
          fi
          job_json=""
          for _ in $(seq 1 30); do
            job_json="$(curl -s -H 'Authorization: Bearer ci-smoke-test' \
              "http://127.0.0.1:8080/api/jobs/$job_id")"
            if printf '%s' "$job_json" | grep -q '"status":"completed"'; then
              break
            fi
            sleep 1
          done
          if ! printf '%s' "$job_json" | grep -q '"status":"completed"'; then
            echo "job response: $job_json"
            exit 1
          fi
          docker exec "$cid" sh -c \
            'find /var/spool/cups-pdf -name "*.pdf" -size +0c | grep -q .'

          step "invalid controls -> 400"
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer ci-smoke-test' -H 'Content-Type: application/json' \
            -d "{\"file_id\":\"$file_id\",\"printer_id\":\"CUPS-PDF\",\"options\":{\"DefinitelyNotAnOption\":\"x\"}}" \
            http://127.0.0.1:8080/api/print)" = 400

          step "idempotency: same key replays the same job"
          key="smoke-idem-1"
          body="{\"file_id\":\"$file_id\",\"printer_id\":\"CUPS-PDF\",\"options\":{}}"
          first="$(curl -s -H 'Authorization: Bearer ci-smoke-test' \
            -H 'Content-Type: application/json' -H "Idempotency-Key: $key" \
            -d "$body" http://127.0.0.1:8080/api/print)"
          second="$(curl -s -D /tmp/idem-headers -H 'Authorization: Bearer ci-smoke-test' \
            -H 'Content-Type: application/json' -H "Idempotency-Key: $key" \
            -d "$body" http://127.0.0.1:8080/api/print)"
          first_id="$(printf '%s' "$first" | sed -n 's/.*"job_id":"\([^"]*\)".*/\1/p')"
          second_id="$(printf '%s' "$second" | sed -n 's/.*"job_id":"\([^"]*\)".*/\1/p')"
          if [ -z "$first_id" ] || [ "$first_id" != "$second_id" ]; then
            echo "first: $first"
            echo "second: $second"
            exit 1
          fi
          grep -qi 'idempotency-replayed: true' /tmp/idem-headers

          step "jobs list + cancel"
          curl -fsS -H 'Authorization: Bearer ci-smoke-test' \
            'http://127.0.0.1:8080/api/jobs?limit=5' | grep -q '"jobs"'
          cancel_response="$(curl -s -w '\n%{http_code}' -X DELETE \
            -H 'Authorization: Bearer ci-smoke-test' \
            "http://127.0.0.1:8080/api/jobs/$first_id")"
          cancel_status="${cancel_response##*$'\n'}"
          cancel_body="${cancel_response%$'\n'*}"
          case "$cancel_status" in
            204|404|409) ;;
            *) echo "unexpected cancel status: $cancel_status body: $cancel_body"; exit 1 ;;
          esac

          step "delete uploaded file"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
            -H 'Authorization: Bearer ci-smoke-test' \
            "http://127.0.0.1:8080/api/files/$md_id")" = 204
      - name: Vulnerability scan (image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: just-print:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln

  compose:
    name: Validate compose example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: docker compose -f examples/compose.yaml config --quiet
