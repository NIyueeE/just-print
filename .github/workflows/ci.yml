name: CI

# 上游（reusable）工作流：PR 与 release.yml 都复用这一定义。
#
# 本地 git 钩子（.githooks/）与这里的门禁共用同一套入口脚本：
#   - just gate-light -> scripts/gate-light.sh   （本地 pre-commit 与 lint 作业）
#   - just gate-heavy -> scripts/gate-heavy.sh   （本地 pre-push  与 check 作业）
#   - scripts/smoke.sh                          （本地重门与 smoke 作业）
# 所以「本地过重门」≈「CI 过 check + smoke」，不会两边漂移。
#
# 触发方式：
#   - pull_request / push main：直接跑（下方 on.push / on.pull_request）
#   - release.yml：uses: ./.github/workflows/ci.yml（workflow_call）
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------ 轻门作业
  # 与本地 pre-commit 的 just gate-light 完全等价（严格模式）。
  lint:
    name: Lint (gate-light)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable # zizmor: ignore[superfluous-actions] action 装 rustup 组件比内联脚本更可复现
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.40.0"
      - name: Install light-gate tools (typos, actionlint, hadolint, zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 各工具用固定 release 版本安装，与 docs/development.md 记录的一致。
          # typos / actionlint / hadolint 是静态二进制，直接落在 /usr/local/bin。
          tyver="$(curl -fsSL https://api.github.com/repos/crate-ci/typos/releases/latest | jq -r .tag_name)"
          curl -fsSL "https://github.com/crate-ci/typos/releases/download/${tyver}/typos-${tyver}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /usr/local/bin ./typos
          alver="$(curl -fsSL https://api.github.com/repos/rhysd/actionlint/releases/latest | jq -r .tag_name)"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/${alver}/actionlint_${alver#v}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
          hlver="$(curl -fsSL https://api.github.com/repos/hadolint/hadolint/releases/latest | jq -r .tag_name)"
          curl -fsSL "https://github.com/hadolint/hadolint/releases/download/${hlver}/hadolint-Linux-x86_64" \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint
          # zizmor：GitHub Actions 安全审计，pip 安装到用户目录。
          python3 -m pip install --user zizmor
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run light gate (strict)
        env:
          PROBE: strict
        run: just gate-light

  # ------------------------------------------------------------ 重门作业
  # 与本地 pre-push 的 just gate-heavy 等价（去掉冒烟，冒烟独立成作业并行跑）。
  check:
    name: Check (gate-heavy build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable # zizmor: ignore[superfluous-actions] action 装 rustup 组件比内联脚本更可复现
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.40.0"
      - name: Run heavy gate (strict, no smoke)
        env:
          PROBE: strict
        run: scripts/gate-heavy.sh --no-smoke

  # ------------------------------------------------------------ 冒烟作业
  # 真实容器端到端（上传 → 预览 → 打印 → 幂等重放 → 任务取消 → 删除）。
  # 脚本 scripts/smoke.sh 与本地 just gate-heavy 共用同一份断言。
  smoke:
    name: Smoke (gate-heavy image + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Run container smoke test
        env:
          PROBE: strict
        run: scripts/smoke.sh

  # ------------------------------------------------------------ 依赖与镜像安全
  # 只对 Rust advisory + license、前端 npm advisory、镜像漏洞做门禁。
  # `cargo audit` 的 bans 子命令曾在多个依赖树里持续报红，已按「可操作的
  # 漏洞」收缩为 advisories + licenses（见 justfile 的 audit 配方注释）。
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # rustsec/audit-check 会把结果发布成 GitHub Check：只要出现一条信息级
    # 警告（例如某个 crate 被 yank），它就会尝试创建 Check，而默认的
    # `contents: read` 会让这一步以 "Resource not accessible by integration"
    # 失败——即使 cargo-audit 报告 0 个漏洞。按该 Action 的文档补上 checks: write。
    permissions:
      contents: read
      checks: write  # 让 audit-check 发布 Check（见上方注释：否则信息级警告会让作业失败）
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image (validation only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Containerfile
          push: false
          load: true
          tags: just-print:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan (image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: just-print:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln

  # ------------------------------------------------------------ 配置校验
  compose:
    name: Validate compose example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate compose file
        run: docker compose -f examples/compose.yaml config --quiet

  # ------------------------------------------------------------ 门禁总结
  # PR 分支保护只勾选这一个 required check 即可覆盖全部门禁；
  # 本地 pre-push 失败对应的就是这里红。
  gate:
    name: Gate summary
    runs-on: ubuntu-latest
    needs: [lint, check, smoke, audit, image, compose]
    if: always()
    steps:
      - name: Fail if any required gate failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gate results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "gate: $r" >&2
              exit 1
            fi
          done
          echo "gate: all required checks passed"
