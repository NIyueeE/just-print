name: Release

# 上游模式：tag 推送先复用同一份 CI 定义（workflow_call -> ./.github/workflows/ci.yml），
# 复用通过后才进入本文件的构建/发布步骤。
#
#   push tag -> CI（上游，lint / check / smoke / audit / image / compose 全过）
#            -> publish（本文件：构建推送镜像 + 创建 GitHub Release）
#
# 好处：发布走的镜像与 PR 里被验证过的镜像走同一条 CI 路径，
# 不会出现「tag 直接绕过检查链就发布」。
on: # zizmor: ignore[concurrency-limits] tag 事件低频，workflow 级并发足够
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # 复用 CI（上游）：所有作业必须全部成功才继续。
  ci:
    name: CI (upstream)
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] actionlint 要求 ./-前缀，$/ 语法会被判非法
    permissions:
      contents: read
      checks: write  # 让上游 CI 的 audit 作业发布 Check

  publish:
    name: Build and push container image (ghcr.io)
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 创建 GitHub Release 页面
      packages: write  # 推送 ghcr.io 镜像
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Lowercase repository name for GHCR
        id: repo
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "repository=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repository }}:latest
            ghcr.io/${{ steps.repo.outputs.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # GitHub Release 与镜像同源缺失过（v0.3.10 只有 tag + 镜像、没有 Release
      # 页面），因此推 tag 即用 docs/releases/<tag>.md 自动建 Release；已存在则
      # 跳过（幂等），说明文件缺失时退回自动生成的 notes。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for $TAG already exists; nothing to do"
          elif [ -f "$notes" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
