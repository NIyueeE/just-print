# docker compose -f examples/compose.yaml up -d
# podman-compose -f examples/compose.yaml up -d
#
# 镜像直接从 GitHub Container Registry 拉取。
# 完整部署说明见 docs/deployment.md。
#
# 只有 JUST_PRINT_TOKEN 是必填项，其余变量都有默认值；这里只保留必填项，
# 可选项以注释列出，按需取消注释即可。
services:
  just-print:
    image: ghcr.io/niyueee/just-print:latest
    container_name: just-print
    restart: unless-stopped
    ports:
      - "${JUST_PRINT_HTTP_PORT:-8080}:8080"
    environment:
      # 必填：准入令牌；未设置时为空值，后端 fail-closed 拒绝启动。
      JUST_PRINT_TOKEN: "${JUST_PRINT_TOKEN}"
      # 以下均有默认值，按需取消注释：
      # JUST_PRINT_AUTO_USB: "0"            # 关闭 USB 打印机自动建队列
      # JUST_PRINT_DISCOVER_IPP: "1"        # mDNS/Avahi + ippfind 自动发现
      # JUST_PRINT_CUPS_PDF: "1"            # 添加 CUPS-PDF 调试打印机
      # JUST_PRINT_USB_PPD: "lsb/usr/cupsfilters/pxlmono.ppd"
      # JUST_PRINT_USB_OPTIONS: "OptionDuplex=True"
      # 完整列表（上传/转换限额、缓存与超时）见 docs/deployment.md。
    # 转换产生的临时文件放在内存文件系统，容器重启即清空。
    tmpfs: /tmp
    # LibreOffice 对 /dev/shm 有依赖，默认 64MiB 在转换大文档时可能不足。
    shm_size: "256m"
    # 基础加固：禁止提权；限制进程数/内存，避免 LibreOffice 异常时拖垮宿主机。
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: "2g"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # 可选：持久化 CUPS spool 与 cups-pdf 输出（命名卷在下方声明）。
    # volumes:
    #   - just-print-cups:/var/spool/cups
    #   - just-print-cups-pdf:/var/spool/cups-pdf
    # 若宿主机有 USB 打印机，取消注释映射 usbfs 目录即可（CUPS 的 usb 后端走 libusb）：
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    # 注意：不需要 /dev/usb/lp*（旧 usblp 字符设备，libusb 不使用；节点不存在时
    # 映射会让容器启动失败）。

# 仅在使用上方持久化卷注释时启用。
# volumes:
#   just-print-cups:
#   just-print-cups-pdf:
